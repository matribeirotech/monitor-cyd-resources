; ============================================================================
;  Mike Monitor - PlatformIO
;  Placa: CYD ESP32-2432S028R versao 2 USB (micro USB + USB-C), display ST7789
;
;  Usando PlatformIO voce NAO precisa mexer no User_Setup.h da TFT_eSPI:
;  toda a configuracao da placa esta nas build_flags abaixo.
;
;  Comandos:
;     pio run                 -> compila
;     pio run -t upload       -> compila e grava
;     pio device monitor      -> abre o serial (feche antes de rodar o agente!)
;     pio run -t upload -t monitor
; ============================================================================

[platformio]
src_dir = firmware/minimal_monitor

[env:cyd]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; se o auto-detect pegar a porta errada, descomente e ajuste:
; upload_port  = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    bitbank2/AnimatedGIF @ ^2.1.1

build_flags =
    ; ---- diz a TFT_eSPI para ignorar o User_Setup.h dela ----
    -D USER_SETUP_LOADED=1

    ; ---- controlador do display ----
    -D ST7789_DRIVER=1
    ; -D ILI9341_2_DRIVER=1        ; alternativa, se a sua unidade for ILI9341
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR       ; troque para TFT_RGB se azul/vermelho invertidos
    -D TFT_INVERSION_OFF=1         ; troque para TFT_INVERSION_ON se sair negativo

    ; ---- pinos do display (HSPI) ----
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    ; ---- fontes ----
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; ---- SPI ----
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1

    ; NAO defina TOUCH_CS: o touch usa a XPT2046_Touchscreen num SPI separado.
    ; Por isso a TFT_eSPI solta este aviso durante o build -- e esperado:
    ;   #warning >>>>------>> TOUCH_CS pin not defined,
    ;            TFT_eSPI touch functions will not be available!
    ; Nao e erro. As funcoes de toque da TFT_eSPI nao sao usadas neste projeto.
