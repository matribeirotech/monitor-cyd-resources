; ============================================================================
;  ESP32-WROOM-32U (Antena Externa) - Wi-Fi Radar + Long-Range BLE Bridge (v2.0)
;  Comandos:
;     pio run -d firmware/wifi_scanner -t upload --upload-port /dev/ttyUSB0
; ============================================================================

[platformio]
src_dir = .

[env:wifi_scanner]
platform      = espressif32
board         = esp32dev
framework     = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed  = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
